<!-- DRUKLEARN CALENDAR -->

<section class="calendar-section" id="calendar">

    <h2>📅 Student Calendar</h2>

    <p>Plan your learning and never miss an important date.</p>

    <div class="calendar">

        <div class="calendar-header">

            <button onclick="changeMonth(-1)">❮</button>

            <h3 id="monthYear"></h3>

            <button onclick="changeMonth(1)">❯</button>

        </div>

        <div class="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div class="days" id="calendarDays"></div>

        <div class="selected-date">
            <h3 id="selectedDate">Select a date</h3>

            <input type="text"
                id="eventInput"
                placeholder="Enter study event or reminder">

            <button onclick="addEvent()">Add Event</button>

            <div id="eventList"></div>
        </div>

    </div>

</section>
