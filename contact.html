<!-- DRUKLEARN CONTACT SECTION -->

<section class="contact-section" id="contact">

    <div class="contact-container">

        <h2>Contact Us</h2>

        <p class="contact-subtitle">
            Have a question or suggestion?
            We'd love to hear from you!
        </p>

        <div class="contact-content">

            <div class="contact-info">

                <h3>Get In Touch</h3>

                <p>
                    📚 DrukLearn – Digital Learning Platform
                </p>

                <p>
                    🇧🇹 Bhutan
                </p>

                <p>
                    📧 Email: support@druklearn.com
                </p>

                <p>
                    💬 We welcome your questions,
                    suggestions and feedback.
                </p>

            </div>

            <div class="contact-form">

                <h3>Send Us a Message</h3>

                <form id="contactForm">

                    <input
                        type="text"
                        id="name"
                        placeholder="Your Full Name"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Your Email Address"
                        required
                    >

                    <input
                        type="text"
                        id="subject"
                        placeholder="Subject"
                        required
                    >

                    <textarea
                        id="message"
                        placeholder="Write your message..."
                        required
                    ></textarea>

                    <button type="submit">
                        Send Message
                    </button>

                </form>

                <p id="formResponse"></p>

            </div>

        </div>

    </div>

</section>
